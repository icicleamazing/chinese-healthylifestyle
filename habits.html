            <h2>健康习惯</h2>
            <p>有一些東西會幫你的健康生活。</p>
            <ol>
              <li>早上時候，吃健康的食物和有蛋白質的食物會給你力量。</li>
              <li>每天，每次吃飯，吃很多不同的營養很重要。</li>
              <li>常常喝水會幫你的身體保持良好的水分量。</li>
              <li>你要一󠇡個󠇡健康的生活營位如果你沒有吃健康的食物你沒辦法想清楚和󠇡有力氣。</li>
            </ol>
            <p>如果你想幫助你的健康生活，你可以常常喝水，吃有蛋白質的食物，每天吃三餐的健康的食物，還要小型不要吃太多不健康的東西。</p>
